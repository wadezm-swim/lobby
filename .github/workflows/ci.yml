name: CI

on:
  push:
    paths-ignore:
      - "**.md"
      - docs/**
      - design/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mac:
    name: Mac app and LobbyCore
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test LobbyCore
        run: swift test --package-path LobbyCore

      - name: Build Lobby for macOS
        run: |
          xcodebuild build \
            -project Lobby.xcodeproj \
            -scheme Lobby \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # Apple Silicon refuses to run a binary with no signature at all, so sign
      # it ad hoc. It still shows the "unidentified developer" prompt once.
      - name: Sign and zip
        run: |
          APP=build/Build/Products/Release/Lobby.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Lobby.zip
          ls -la Lobby.zip

      # Run the zipped app on the runner for a few seconds. A crash at launch
      # shows up here with its report, instead of as a bouncing Dock icon.
      - name: Launch check
        run: |
          rm -rf launch && mkdir launch && ditto -x -k Lobby.zip launch
          APP=launch/Lobby.app
          echo "Embedded frameworks:"; ls "$APP/Contents/Frameworks" || echo "(none)"
          echo "Architectures:"; lipo -archs "$APP/Contents/MacOS/Lobby"
          "$APP/Contents/MacOS/Lobby" > launch.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then
            echo "Lobby was still running after 15 seconds"
            kill "$PID" || true
            echo "--- app output ---"; cat launch.log
          else
            CODE=0; wait "$PID" || CODE=$?
            echo "::error::Lobby exited with code $CODE within 15 seconds"
            echo "--- app output ---"; cat launch.log
            sleep 5
            echo "--- crash reports ---"; ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
            for f in ~/Library/Logs/DiagnosticReports/Lobby*; do [ -f "$f" ] && head -150 "$f"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Lobby.app
          path: Lobby.zip
          retention-days: 14

      # Every push refreshes one download link:
      # https://github.com/wadezm-swim/lobby/releases/download/latest/Lobby.zip
      - name: Publish the download link
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The runner's link to api.github.com sometimes times out; try a few times.
          for attempt in 1 2 3 4; do
            gh release delete latest --cleanup-tag --yes || true
            if gh release create latest Lobby.zip \
                --prerelease \
                --title "Lobby, latest build" \
                --notes "Built from ${{ github.sha }} on branch ${{ github.ref_name }}. Download Lobby.zip, unzip, drag Lobby to Applications. First open: System Settings > Privacy & Security > Open Anyway."; then
              echo "Published on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt didn't get through; trying again in 20 seconds"
            sleep 20
          done
          echo "::error::Couldn't publish the release after four tries"
          exit 1

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
