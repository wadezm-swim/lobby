name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mac:
    name: Mac app and LobbyCore
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test LobbyCore
        run: swift test --package-path LobbyCore

      - name: Build Lobby for macOS
        run: |
          xcodebuild build \
            -project Lobby.xcodeproj \
            -scheme Lobby \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # Apple Silicon refuses to run a binary with no signature at all, so sign
      # it ad hoc. It still shows the "unidentified developer" prompt once.
      - name: Sign and zip
        run: |
          APP=build/Build/Products/Release/Lobby.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Lobby.zip
          ls -la Lobby.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lobby.app
          path: Lobby.zip
          retention-days: 14

      # Every push refreshes one download link:
      # https://github.com/wadezm-swim/lobby/releases/download/latest/Lobby.zip
      - name: Publish the download link
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Lobby.zip \
            --prerelease \
            --title "Lobby, latest build" \
            --notes "Built from ${{ github.sha }} on branch ${{ github.ref_name }}. Download Lobby.zip, unzip, drag Lobby to Applications. First open: System Settings > Privacy & Security > Open Anyway."

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
