<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby concierge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#D9D9DE}
</style>
</helmet>
<div style="width: 720px; height: 460px; box-sizing: border-box; background: #D9D9DE; padding: 36px 56px; font-family: 'Urbanist', system-ui, sans-serif; display: flex">
  <div role="dialog" aria-label="Concierge" style="flex: 1; background: #0E0E0E; color: #F5F5F5; border-radius: 28px; display: flex; flex-direction: column; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 18px">
      <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #D4FF3F; color: #0E0E0E; display: flex; align-items: center; justify-content: center; font-weight: 800">L</span>
      <label for="cq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ask or capture</label>
      <input id="cq" type="text" value="chase officials roster thursday" style="flex: 1; min-height: 44px; border: 0; outline: none; background: transparent; color: #F5F5F5; font: 500 19px 'Urbanist', sans-serif">
      <span style="font-size: 12px; color: #9B9B9F; background: #1F1F1F; border-radius: 999px; padding: 4px 10px">esc</span>
    </div>
    <div style="padding: 0 10px; display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="4">
        <button type="button" onClick="{{ item.pick }}" style="{{ item.rowStyle }}">
          <span style="display: flex; flex-direction: column; gap: 2px; text-align: left">
            <span style="{{ item.titleStyle }}">{{ item.title }}</span>
            <span style="{{ item.detailStyle }}">{{ item.detail }}</span>
          </span>
          <span style="{{ item.keyStyle }}">{{ item.key }}</span>
        </button>
      </sc-for>
    </div>
    <div style="margin-top: auto; display: flex; justify-content: space-between; padding: 12px 20px; font-size: 12px; color: #9B9B9F">
      <span>Option+Space from anywhere on your Mac</span>
      <span>↑↓ choose · ↵ do it</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":460}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'task' };
  }
  renderVals() {
    const rows = [
      { id: 'task', title: 'Task: Chase officials roster', detail: 'Notion inbox · State SC Champs · due Thu 22 Oct', key: '↵' },
      { id: 'remind', title: 'Reminder only', detail: 'Thursday 9:00am, menu bar nudge', key: '⌘1' },
      { id: 'search', title: 'Search "officials roster"', detail: '3 Notion pages', key: '⌘2' },
      { id: 'waiting', title: 'Add to Waiting on', detail: 'Flags it if nothing back by Thursday', key: '⌘3' }
    ];
    const base = 'display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 58px; width: 100%; box-sizing: border-box; padding: 8px 14px; border: 0; border-radius: 18px; cursor: pointer; font-family: inherit; ';
    return {
      items: rows.map((r) => {
        const on = this.state.picked === r.id;
        return {
          ...r,
          rowStyle: base + (on ? 'background: #D4FF3F;' : 'background: transparent;'),
          titleStyle: 'font-size: 15px; font-weight: 700; color: ' + (on ? '#0E0E0E' : '#F5F5F5') + ';',
          detailStyle: 'font-size: 13px; color: ' + (on ? '#2A2A2A' : '#9B9B9F') + ';',
          keyStyle: 'font-size: 12px; font-weight: 700; color: ' + (on ? '#0E0E0E' : '#9B9B9F') + ';',
          pick: () => this.setState({ picked: r.id })
        };
      })
    };
  }
}
</script>
</body>
</html>
